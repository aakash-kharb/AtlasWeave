name: Bug report
description: Report incorrect import, evidence, review, or export behavior.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands and synthetic data only. Never upload confidential records.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: AtlasWeave version, Python version, and operating system
    validations:
      required: true
