version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
